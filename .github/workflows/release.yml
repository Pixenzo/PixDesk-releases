# PixDesk sürüm hattı.
#
# Kaynak kod özel depoda (Pixenzo/PixDesk) durur; bu iş akışı onu salt okunur
# bir deploy key ile çeker, Windows'ta derler ve kurulum paketini, güncelleme
# imzasını ve `latest.json` dosyasını bu deponun sürümlerine yükler.
# Uygulama güncellemeyi şuradan denetler:
#   https://github.com/Pixenzo/PixDesk-releases/releases/latest/download/latest.json
#
# Tetikleme: özel depoda `v*` etiketi açılınca en geç yarım saat içinde
# kendiliğinden, ya da Actions sekmesinden etiket adıyla elle.
#
# Gizli değerler:
#   PIXDESK_SOURCE_KEY                  özel depo için salt okunur deploy key
#   TAURI_SIGNING_PRIVATE_KEY           güncelleme imza anahtarı
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  imza anahtarının parolası
#   WINDOWS_CERTIFICATE (isteğe bağlı)  Authenticode sertifikası, base64 PFX
#   WINDOWS_CERTIFICATE_PASSWORD        sertifikanın parolası
name: Sürüm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Özel depodaki etiket (ör. v0.3.0)"
        required: true
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SOURCE_REPO: git@github.com:Pixenzo/PixDesk.git

jobs:
  find:
    name: Yayımlanacak etiketi bul
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ secrets.PIXDESK_SOURCE_KEY }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            # En yeni `v*` etiketi; sürümü zaten varsa yapılacak iş yok.
            mkdir -p ~/.ssh
            printf '%s\n' "$SOURCE_KEY" > ~/.ssh/source_key
            chmod 600 ~/.ssh/source_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/source_key -o IdentitiesOnly=yes"
            tag=$(git ls-remote --tags --refs "$SOURCE_REPO" 'v*' \
              | sed 's#.*refs/tags/##' | sort -V | tail -n 1)
            rm -f ~/.ssh/source_key
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Geçerli bir sürüm etiketi yok: '$tag'"
            tag=""
          elif gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag zaten yayımlanmış."
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Windows derlemesi
    needs: find
    if: needs.find.outputs.tag != ''
    runs-on: windows-latest
    env:
      TAG: ${{ needs.find.outputs.tag }}
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          repository: Pixenzo/PixDesk
          ref: ${{ needs.find.outputs.tag }}
          ssh-key: ${{ secrets.PIXDESK_SOURCE_KEY }}
          persist-credentials: false
          path: src

      - name: Sürüm numarasını denetle
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          want="${TAG#v}"
          conf=$(node -p "require('./crates/app/tauri.conf.json').version")
          crate=$(grep -m1 '^version' crates/app/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$conf" != "$want" ] || [ "$crate" != "$want" ]; then
            echo "Etiket $TAG, tauri.conf.json $conf, Cargo.toml $crate: sürümler aynı olmalı."
            exit 1
          fi

      - name: Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Derle ve imzala
        shell: bash
        working-directory: src/crates/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      # Authenticode: sertifika gizli değeri eklenince kurulum paketi Windows
      # için de imzalanır. Güncelleme imzası kurulum paketinin son hâlinden
      # alınmalı, bu yüzden imza dosyası bu adımda yeniden üretilir.
      - name: Authenticode imzası
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $setup = Get-ChildItem src/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx
          Remove-Item "$($setup.FullName).sig" -ErrorAction SilentlyContinue
          npx --yes @tauri-apps/cli@2 signer sign $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Sürüm dosyalarını hazırla
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          setup=$(ls src/target/release/bundle/nsis/*-setup.exe | head -n 1)
          name="PixDesk_${TAG#v}_x64-setup.exe"
          cp "$setup" "out/$name"
          cp "$setup.sig" "out/$name.sig"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
          node -e '
            const fs = require("fs");
            const [version, url, sigPath] = process.argv.slice(1);
            const manifest = {
              version,
              notes: "PixDesk " + version,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": { signature: fs.readFileSync(sigPath, "utf8").trim(), url },
              },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(manifest, null, 2));
          ' "${TAG#v}" "$url" "out/$name.sig"
          (cd out && sha256sum "$name" > SHA256SUMS.txt)
          ls -la out

      - name: Yayımla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/* \
            -R "$GITHUB_REPOSITORY" \
            --title "PixDesk ${TAG#v}" \
            --notes "Windows için kurulum paketi. Kurulu uygulamalar bu sürüme kendiliğinden güncellenir."
